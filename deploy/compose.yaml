name: freight

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  environment: &app-environment
    FREIGHT_MODE: production
    PUBLIC_HOST: ${PUBLIC_HOST:?Configure PUBLIC_HOST}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Configure ALLOWED_HOSTS}
    FREIGHT_ALLOWED_ORIGINS: ${FREIGHT_ALLOWED_ORIGINS:?Configure FREIGHT_ALLOWED_ORIGINS}
    DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL}
    OIDC_ISSUER: ${OIDC_ISSUER:?Configure OIDC_ISSUER}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Configure OIDC_CLIENT_ID}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Configure OIDC_CLIENT_SECRET}
    SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?Configure SESSION_SIGNING_KEY}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL_RULES: ${OPENAI_MODEL_RULES:-gpt-6-luna}
    OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
    WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-45}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [private]
  depends_on:
    db: {condition: service_healthy}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: freight
      POSTGRES_USER: freight_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets: [postgres_owner_password, postgres_app_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-freight.sh:ro
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U freight_owner -d freight"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend
    restart: "no"
    command: [python, -m, alembic, upgrade, head]
    environment:
      <<: *app-environment
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Configure MIGRATION_DATABASE_URL}

  api:
    <<: *backend
    command: [python, -m, uvicorn, "freight.api.app:app", --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "127.0.0.1,172.30.0.2", --no-access-log, --limit-concurrency, "80", --timeout-keep-alive, "5"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import os,httpx; r=httpx.get('http://127.0.0.1:8000/health',headers={'Host':os.environ['PUBLIC_HOST'],'X-Forwarded-Proto':'https'},timeout=5); r.raise_for_status()"]
      interval: 20s
      timeout: 8s
      retries: 3

  worker:
    <<: *backend
    command: [python, -m, freight.workers.runner]
    stop_grace_period: 90s
    mem_limit: 4g
    cpus: 2
    depends_on:
      migrate: {condition: service_completed_successfully}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
    depends_on:
      api: {condition: service_healthy}

  gateway:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Configure PUBLIC_HOST}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      private: {ipv4_address: 172.30.0.2}
    depends_on: [web, api]

networks:
  private:
    ipam:
      config: [{subnet: 172.30.0.0/24}]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_owner_password:
    file: ./secrets/postgres_owner_password
  postgres_app_password:
    file: ./secrets/postgres_app_password
