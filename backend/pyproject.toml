[project]
name = "saudi-freight"
version = "0.1.0"
description = "Auditable fixed-team freight planning and reviewed operational rules"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "ortools>=9.12,<10",
  "openai>=2,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "tzdata>=2025.1",
  "authlib>=1.6,<2",
  "itsdangerous>=2.2,<3",
  "httpx2>=2.13.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "hypothesis>=6.130,<7",
]

[project.scripts]
freight = "freight.cli:main"
freight-worker = "freight.workers.runner:main"
freight-admin = "freight.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a dedicated PostgreSQL test database", "live_ai: requires explicitly configured OpenAI credentials"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ortools.*", "authlib.*"]
ignore_missing_imports = true
