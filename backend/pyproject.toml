[project]
name = "saudi-freight"
version = "0.1.0"
description = "Freight planning engine for Saudi full-truckload fleets"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "ortools>=9.12,<10",
  "openai>=2,<3",
  "tzdata>=2025.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
# PostgreSQL instead of the default SQLite file (DATABASE_URL=postgresql+psycopg://...)
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "hypothesis>=6.130,<7",
    "httpx>=0.28,<1",
    "types-openpyxl>=3.1.5.20260827",
]

[project.scripts]
freight = "freight.cli:main"
freight-admin = "freight.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true
